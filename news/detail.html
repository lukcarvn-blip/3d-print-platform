<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tin Tức | Legato</title>
<link rel="stylesheet" href="/shared/style.css">
<style>
  .article-header {
    margin-bottom: 32px;
  }
  .article-title {
    font-size: 36px;
    font-weight: 800;
    line-height: 1.3;
    margin-bottom: 16px;
    color: #fff;
  }
  @media (max-width: 768px) {
    .article-title { font-size: 28px; }
  }
  .article-meta {
    display: flex;
    align-items: center;
    gap: 16px;
    color: var(--text-muted);
    font-size: 14px;
    margin-bottom: 24px;
  }
  .article-meta-item {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .article-cover {
    width: 100%;
    aspect-ratio: 16/9;
    object-fit: cover;
    border-radius: 16px;
    margin-bottom: 32px;
    border: 1px solid var(--border);
  }
  .article-content {
    font-size: 16px;
    line-height: 1.8;
    color: var(--text-secondary);
  }
  .article-content p {
    margin-bottom: 24px;
  }
  .article-content h2, .article-content h3 {
    color: #fff;
    margin-top: 40px;
    margin-bottom: 16px;
  }
  .article-summary {
    font-size: 18px;
    font-weight: 500;
    color: var(--text-secondary);
    border-left: 4px solid var(--accent-green);
    padding-left: 16px;
    margin-bottom: 32px;
    line-height: 1.6;
    background: rgba(0, 255, 136, 0.05);
    padding: 16px;
    border-radius: 0 8px 8px 0;
  }
</style>
</head>
<body>

<div id="app">
  <main class="main-content">
    <div class="container" style="max-width:800px; margin: 0 auto; padding-top: 24px;">
      
      <a href="/news/" data-link class="btn btn-ghost" style="margin-bottom: 24px; display: inline-flex; padding-left:0;">
        <i data-lucide="arrow-left" style="width:16px;"></i> Quay lại danh sách
      </a>

      <div id="article-container">
        <div style="text-align: center; padding: 60px; color: var(--text-muted);">
          <i data-lucide="loader" class="spin" style="width: 32px; height: 32px; margin-bottom: 16px;"></i>
          <p>Đang tải bài viết...</p>
        </div>
      </div>

    </div>
  </main>
</div>

<script src="https://unpkg.com/lucide@latest"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
<script src="/shared/db.js"></script>
<script src="/shared/firebase.js"></script>
<script src="/shared/auth.js"></script>
<script src="/shared/app.js"></script>
<script>
DB.init();
BDB.init();

function formatDate(isoString) {
  const date = new Date(isoString);
  return date.toLocaleDateString('vi-VN', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
}

function initArticle() {
  const urlParams = new URLSearchParams(window.location.search);
  const id = urlParams.get('id');
  if (!id) {
    document.getElementById('article-container').innerHTML = `<p class="text-center" style="color:red;">Không tìm thấy bài viết.</p>`;
    return;
  }

  BDB.listenNews(newsList => {
    const article = newsList.find(n => n.id === id);
    if (!article) {
      document.getElementById('article-container').innerHTML = `<p class="text-center" style="color:red;">Không tìm thấy bài viết.</p>`;
      return;
    }

    document.title = `${article.title} | Legato Tin Tức`;

    // Convert newlines to paragraphs
    const formattedContent = article.content.split('\n').filter(p => p.trim() !== '').map(p => `<p>${p}</p>`).join('');

    document.getElementById('article-container').innerHTML = `
      <div class="article-header">
        <h1 class="article-title">${article.title}</h1>
        <div class="article-meta">
          <span class="article-meta-item"><i data-lucide="calendar" style="width:14px;"></i> ${formatDate(article.createdAt)}</span>
          <span class="article-meta-item"><i data-lucide="user" style="width:14px;"></i> ${article.author || 'Admin'}</span>
        </div>
      </div>
      
      ${article.image ? `<img src="${article.image}" alt="Cover" class="article-cover">` : ''}
      
      <div class="article-summary">${article.summary}</div>
      
      <div class="article-content">
        ${formattedContent}
      </div>
    `;
    
    if (typeof lucide !== 'undefined') lucide.createIcons();
  });
}

initArticle();
</script>
</body>
</html>
