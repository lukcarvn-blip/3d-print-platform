<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tin Tức | Legato</title>
<link rel="stylesheet" href="/shared/style.css">
<style>
  .news-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 24px;
    margin-top: 24px;
  }
  @media (max-width: 992px) { .news-grid { grid-template-columns: repeat(2, 1fr); gap: 16px; } }
  @media (max-width: 600px) { .news-grid { grid-template-columns: 1fr; } }

  .news-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 16px;
    overflow: hidden;
    transition: 0.3s ease;
    display: flex;
    flex-direction: column;
    text-decoration: none;
    color: inherit;
  }
  .news-card:hover { 
    transform: translateY(-6px); 
    box-shadow: 0 20px 40px rgba(0,0,0,0.4); 
    border-color: rgba(255,255,255,0.15); 
  }

  .news-img {
    width: 100%;
    aspect-ratio: 16/9;
    object-fit: cover;
    border-bottom: 1px solid var(--border);
  }

  .news-content {
    padding: 20px;
    display: flex;
    flex-direction: column;
    flex: 1;
  }

  .news-date {
    font-size: 12px;
    color: var(--text-muted);
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .news-title {
    font-size: 18px;
    font-weight: 700;
    line-height: 1.4;
    margin-bottom: 12px;
    color: #fff;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .news-summary {
    font-size: 14px;
    color: var(--text-secondary);
    line-height: 1.5;
    margin-bottom: 16px;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
    flex: 1;
  }

  .news-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: auto;
    padding-top: 16px;
    border-top: 1px solid rgba(255,255,255,0.05);
  }

  .news-author {
    font-size: 13px;
    color: var(--text-muted);
    font-weight: 500;
  }

  .read-more {
    font-size: 13px;
    color: var(--accent-green);
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 4px;
  }
</style>
</head>
<body>

<div id="app">
  <main class="main-content">
    <div class="container" style="max-width:1200px;">
      <div style="margin-bottom: 32px; text-align: center;">
        <h1 class="font-display font-800" style="font-size: 40px; margin-bottom: 12px; color: #fff;">Tin Tức & Khám Phá</h1>
        <p class="text-secondary" style="font-size: 16px; max-width: 600px; margin: 0 auto;">Cập nhật những xu hướng công nghệ in 3D mới nhất, các mẹo hữu ích và những tác phẩm ấn tượng từ cộng đồng Legato.</p>
      </div>

      <div class="news-grid" id="news-grid">
        <!-- Đang tải... -->
        <div style="grid-column: 1/-1; text-align: center; padding: 40px; color: var(--text-muted);">
          <i data-lucide="loader" class="spin" style="width: 32px; height: 32px; margin-bottom: 16px;"></i>
          <p>Đang tải tin tức...</p>
        </div>
      </div>
    </div>
  </main>
</div>

<script src="https://unpkg.com/lucide@latest"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
<script src="/shared/db.js"></script>
<script src="/shared/firebase.js"></script>
<script src="/shared/auth.js"></script>
<script src="/shared/app.js"></script>
<script>
DB.init();
BDB.init();

function formatDate(isoString) {
  const date = new Date(isoString);
  return date.toLocaleDateString('vi-VN', { day: '2-digit', month: '2-digit', year: 'numeric' });
}

function initNews() {
  BDB.listenNews(newsList => {
    const grid = document.getElementById('news-grid');
    if (newsList.length === 0) {
      grid.innerHTML = `<div style="grid-column: 1/-1; text-align: center; padding: 40px; color: var(--text-muted); background: var(--bg-card); border: 1px dashed var(--border); border-radius: 16px;">Hiện chưa có bài tin tức nào.</div>`;
      return;
    }

    grid.innerHTML = newsList.map(n => `
      <a href="/news/detail.html?id=${n.id}" class="news-card" data-link>
        <img src="${n.image}" alt="${n.title}" class="news-img" loading="lazy">
        <div class="news-content">
          <div class="news-date"><i data-lucide="calendar" style="width:14px; height:14px;"></i> ${formatDate(n.createdAt)}</div>
          <h3 class="news-title">${n.title}</h3>
          <p class="news-summary">${n.summary}</p>
          <div class="news-footer">
            <span class="news-author">${n.author || 'Legato'}</span>
            <span class="read-more">Đọc tiếp <i data-lucide="arrow-right" style="width:14px;"></i></span>
          </div>
        </div>
      </a>
    `).join('');
    
    if (typeof lucide !== 'undefined') lucide.createIcons();
  });
}

initNews();
</script>
</body>
</html>
