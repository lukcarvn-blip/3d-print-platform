<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Job Board | Legato Print Network</title>
<link rel="stylesheet" href="/shared/style.css">
</head>
<body>
<div class="app-layout">
  <!-- Sidebar injected by app.js -->
  <main class="main-content">
    <header class="top-header border-b">
      <div class="search-bar">
        <i data-lucide="search" class="search-icon"></i>
        <input type="text" placeholder="Tìm mô hình, xưởng in, thiết kế viên...">
      </div>
      <div class="header-actions"></div>
    </header>
    <div style="background: linear-gradient(135deg, rgba(124,58,237,0.1) 0%, rgba(0,255,136,0.1) 100%); padding: 40px 24px; text-align:center;">
      <h1 class="font-display font-800 mb-12" style="font-size:36px;">Makers Job Pool (Bids)</h1>
      <p class="text-muted">Nhận các yêu cầu "Make to order" ẩn danh từ khách hàng.</p>
    </div>

    <div class="p-24">
      <div class="grid-2" id="jobs-container"></div>
    </div>
  </main>
</div>

<script src="/shared/db.js"></script>
<script src="/shared/app.js"></script>
<script>
DB.init();

function renderJobs() {
  const bids = DB.getBids();
  const container = document.getElementById('jobs-container');
  
  if (bids.length === 0) {
    container.innerHTML = `<div class="p-32 text-center text-muted" style="grid-column: 1/-1;">Hiện không có Bids nào chờ duyệt.</div>`;
    return;
  }
  
  container.innerHTML = bids.map((b, i) => {
    const platformFee = b.budget * 0.20;
    const makerPayout = b.budget - platformFee;

    let actionHTML = '';
    
    if (b.status === 'pending') {
      actionHTML = `
        <div style="background:rgba(255,255,255,0.02); padding:16px; border-radius:8px; margin-top:16px;">
          <div style="display:flex; justify-content:space-between; margin-bottom:8px;" class="text-sm">
            <span class="text-muted">Khách đặt (Bid):</span> <strong>${DB.formatVND(b.budget)}</strong>
          </div>
          <div style="display:flex; justify-content:space-between; margin-bottom:8px;" class="text-sm">
            <span class="text-muted">Phí Nền Tảng (20%):</span> <span class="text-red">-${DB.formatVND(platformFee)}</span>
          </div>
          <div style="display:flex; justify-content:space-between; margin-bottom:16px; padding-top:8px; border-top:1px dashed var(--border);">
            <span class="text-primary font-bold">XƯỞNG THỰC NHẬN:</span> <strong style="color:var(--accent-green); font-size:18px;">${DB.formatVND(makerPayout)}</strong>
          </div>
          <div class="slide-claim-wrap" onmousedown="startSlide(event, '${b.id}', this)">
            <div class="slide-claim-track"></div>
            <div class="slide-claim-fill"></div>
            <div class="slide-claim-label">Slide to Accept <i data-lucide="check-circle" style="width:16px; margin-left:8px;"></i></div>
            <div class="slide-claim-handle"><i data-lucide="chevron-right" style="color:black;"></i></div>
          </div>
        </div>
      `;
    } else {
      actionHTML = `<div class="mt-16 p-12 text-center text-sm font-bold" style="background:rgba(0,255,136,0.1); border:1px solid rgba(0,255,136,0.3); border-radius:8px; color:var(--accent-green);">🎉 Đã có Xưởng nhận (Chờ in)</div>`;
    }

    return `
      <div class="job-card animate-fade-in" style="animation-delay:${i*0.1}s">
        <div class="job-card-header" style="border-bottom: 1px solid var(--border); padding-bottom: 16px; margin-bottom: 0;">
          <img src="${b.dropImage}" class="job-card-avatar" alt="Drop" style="border-radius: 4px;">
          <div class="job-card-meta">
            <div class="job-card-title">${b.dropName}</div>
            <div class="job-card-sub text-purple"><i data-lucide="user-x" style="width:12px;display:inline-block;vertical-align:-2px;"></i> Người mua ẩn danh</div>
          </div>
        </div>
        ${actionHTML}
      </div>
    `;
  }).join('');
  if (typeof lucide !== 'undefined') lucide.createIcons();
}

let isSliding = false, currentHandle = null, currentWrap = null, startX = 0, maxSlide = 0, activeBidId = null;

function startSlide(e, bidId, wrapEl) {
  isSliding = true; activeBidId = bidId; currentWrap = wrapEl;
  currentHandle = wrapEl.querySelector('.slide-claim-handle');
  maxSlide = currentWrap.offsetWidth - currentHandle.offsetWidth - 8;
  startX = e.clientX - currentHandle.offsetLeft;
  document.addEventListener('mousemove', slide);
  document.addEventListener('mouseup', endSlide);
}
function slide(e) {
  if (!isSliding) return;
  let newLeft = e.clientX - startX;
  if (newLeft < 4) newLeft = 4;
  if (newLeft > maxSlide) newLeft = maxSlide;
  currentHandle.style.left = newLeft + 'px';
  currentWrap.querySelector('.slide-claim-fill').style.width = (newLeft + currentHandle.offsetWidth/2) + 'px';
}
function endSlide() {
  if (!isSliding) return;
  isSliding = false;
  document.removeEventListener('mousemove', slide); document.removeEventListener('mouseup', endSlide);
  
  if (parseInt(currentHandle.style.left) > maxSlide * 0.8) {
    currentHandle.style.left = maxSlide + 'px'; currentWrap.querySelector('.slide-claim-fill').style.width = '100%';
    setTimeout(() => { DB.acceptBid(activeBidId); renderJobs(); }, 300);
  } else {
    currentHandle.style.left = '4px'; currentWrap.querySelector('.slide-claim-fill').style.width = '0';
  }
}

renderJobs();
</script>
</body>
</html>
