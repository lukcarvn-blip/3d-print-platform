<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 - Không Tìm Thấy Trang | Legato</title>
<link rel="stylesheet" href="/shared/style.css">
<style>
  .not-found-container {
    height: calc(100vh - 70px);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
    overflow: hidden;
  }
  .not-found-code {
    font-size: 160px;
    font-weight: 900;
    line-height: 1;
    font-family: 'Space Grotesk', sans-serif;
    background: linear-gradient(135deg, var(--accent-green) 0%, var(--accent-purple) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 24px;
    animation: float 6s ease-in-out infinite;
    position: relative;
    letter-spacing: -8px;
    z-index: 2;
  }
  .not-found-title {
    font-size: 32px;
    font-weight: 700;
    color: white;
    margin-bottom: 16px;
    font-family: 'Space Grotesk', sans-serif;
  }
  .not-found-desc {
    font-size: 16px;
    color: var(--text-muted);
    max-width: 480px;
    margin-bottom: 40px;
    line-height: 1.6;
  }
  .not-found-3d-model {
    position: absolute;
    width: 250px;
    height: 250px;
    background: radial-gradient(circle, rgba(0,255,136,0.15) 0%, rgba(139,92,246,0.1) 40%, transparent 70%);
    border-radius: 50%;
    z-index: 1;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    filter: blur(20px);
    animation: pulseGlow 4s alternate infinite;
  }
  @keyframes float {
    0% { transform: translateY(0px); }
    50% { transform: translateY(-15px); }
    100% { transform: translateY(0px); }
  }
  @keyframes pulseGlow {
    0% { transform: translate(-50%, -50%) scale(0.8); opacity: 0.5; }
    100% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; }
  }
</style>
</head>
<body>
<div class="app-layout">
  <!-- Sidebar injected by app.js -->
  <main class="main-content">
    <header class="top-header justify-between border-b">
      <div class="search-bar">
        <i data-lucide="search" class="search-icon"></i>
        <input type="text" placeholder="Tìm mô hình, xưởng in, thiết kế viên...">
      </div>
      <div class="header-actions"></div>
    </header>

    <div class="not-found-container">
      <div style="position: relative;">
        <div class="not-found-3d-model"></div>
        <div class="not-found-code">404</div>
      </div>
      <h1 class="not-found-title">Mô hình này chưa được in</h1>
      <p class="not-found-desc">Trang bạn đang tìm kiếm có thể đã bị xóa, đổi tên hoặc chưa bao giờ tồn tại trên hệ thống của chúng tôi. Xin vui lòng kiểm tra lại đường dẫn.</p>
      <div style="display: flex; gap: 16px;">
        <a href="/" data-link class="btn btn-primary btn-lg" style="text-decoration:none;"><i data-lucide="home" style="width:18px;"></i> Về Trang Chủ</a>
        <a href="/drops/" data-link class="btn btn-ghost btn-lg" style="text-decoration:none;">Khám Phá Drops</a>
      </div>
    </div>
  </main>
</div>

<script src="/shared/db.js"></script>
<script src="/shared/app.js"></script>
<script>
DB.init();
</script>
</body>
</html>
