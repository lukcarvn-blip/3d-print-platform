<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thanh toán | Legato</title>
<link rel="stylesheet" href="/shared/style.css">
<style>
  .checkout-container { max-width: 100%; margin: 32px 0; padding: 0 24px; min-height: 60vh; }
  .checkout-header { font-family: 'Space Grotesk', sans-serif; font-size: 28px; font-weight: 800; margin-bottom: 24px; color: white; }
  .checkout-layout { display: grid; grid-template-columns: 2fr 1fr; gap: 32px; }
  @media (max-width: 768px) { .checkout-layout { grid-template-columns: 1fr; gap: 24px; } .checkout-container { margin: 20px auto; padding: 0 16px; } .checkout-form, .cart-summary { padding: 16px; } }
  
  .checkout-form { background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.05); padding: 24px; border-radius: 12px; }
  .form-group { margin-bottom: 16px; }
  .form-label { display: block; font-size: 13px; font-weight: 700; margin-bottom: 8px; color: var(--text-muted); }
  .form-input { width: 100%; background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; padding: 12px; color: white; font-family: inherit; font-size: 14px; }
  .form-input:focus { outline: none; border-color: var(--accent-green); }
  
  .payment-methods { display: flex; flex-direction: column; gap: 12px; margin-top: 24px; }
  .payment-method { display: flex; align-items: center; gap: 12px; padding: 16px; border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; cursor: pointer; transition: 0.2s; }
  .payment-method:hover { border-color: var(--accent-green); background: rgba(0,255,136,0.05); }
  .payment-method.active { border-color: var(--accent-green); background: rgba(0,255,136,0.1); }
  
  .cart-summary { background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.05); padding: 24px; border-radius: 12px; height: fit-content; position: sticky; top: 100px; }
  .summary-item { display: flex; justify-content: space-between; margin-bottom: 12px; font-size: 13px; color: var(--text-muted); }
  .summary-item-name { flex: 1; margin-right: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .summary-row { display: flex; justify-content: space-between; margin-bottom: 12px; color: var(--text-muted); font-size: 14px; }
  .summary-total { display: flex; justify-content: space-between; margin-top: 16px; padding-top: 16px; border-top: 1px dashed rgba(255,255,255,0.1); font-weight: 800; font-size: 20px; color: white; }
  
  .submit-btn { width: 100%; padding: 14px; background: var(--accent-green); color: black; font-weight: 800; font-size: 16px; border: none; border-radius: 8px; cursor: pointer; margin-top: 24px; display: flex; justify-content: center; align-items: center; gap: 8px; }
  .submit-btn:hover { opacity: 0.9; }
</style>
</head>
<body>
<div class="app-layout">
  <main class="main-content">
    <header class="top-header justify-between border-b" style="height:70px;">
      <a href="/cart/" class="back-btn" data-link style="display:flex;align-items:center;gap:8px;color:var(--text-muted);text-decoration:none;">
        <i data-lucide="arrow-left" style="width:18px;"></i>
        <span style="font-size:14px;font-weight:600;">Quay lại giỏ hàng</span>
      </a>
      <div class="header-actions" style="display:flex;align-items:center;gap:12px;"></div>
    </header>

    <div class="checkout-container">
      <h1 class="checkout-header">Thanh Toán</h1>
      <div class="checkout-layout">
        <div class="checkout-form">
          <h2 style="font-size: 18px; margin-bottom: 16px;">Thông tin nhận hàng</h2>
          <div class="form-group">
            <label class="form-label">Họ và tên</label>
            <input type="text" id="f-name" class="form-input" placeholder="Nhập họ tên...">
          </div>
          <div class="form-group">
            <label class="form-label">Số điện thoại</label>
            <input type="text" id="f-phone" class="form-input" placeholder="Nhập số điện thoại...">
          </div>
          <div class="form-group">
            <label class="form-label">Địa chỉ giao hàng</label>
            <input type="text" id="f-address" class="form-input" placeholder="Nhập địa chỉ nhận hàng...">
          </div>
          
          <h2 style="font-size: 18px; margin-top: 32px; margin-bottom: 16px;">Phương thức thanh toán</h2>
          <div class="payment-methods">
            <div class="payment-method active" onclick="selectPayment(this, 'cod')">
              <i data-lucide="truck" style="color:var(--accent-green);"></i>
              <div>
                <div style="font-weight:700; color:white; font-size:14px;">Thanh toán khi nhận hàng (COD)</div>
                <div style="font-size:12px; color:var(--text-muted);">Giao hàng thu tiền mặt tận nơi</div>
              </div>
            </div>
            <div class="payment-method" onclick="selectPayment(this, 'bank')">
              <i data-lucide="credit-card" style="color:var(--accent-purple);"></i>
              <div>
                <div style="font-weight:700; color:white; font-size:14px;">Chuyển khoản ngân hàng</div>
                <div style="font-size:12px; color:var(--text-muted);">Thanh toán an toàn qua mã QR</div>
              </div>
            </div>
          </div>
        </div>
        
        <div class="cart-summary">
          <h2 style="font-size:18px; margin-bottom:20px; color:white;">Đơn hàng của bạn</h2>
          <div id="summary-items"></div>
          
          <div style="margin-top:20px; padding-top:16px; border-top:1px solid rgba(255,255,255,0.1);">
            <div class="summary-row"><span>Tạm tính:</span> <span id="summary-subtotal"></span></div>
            <div class="summary-row"><span>Phí giao hàng:</span> <span>Miễn phí</span></div>
            <div class="summary-total"><span>Tổng cộng:</span> <span id="summary-total" style="color:var(--accent-green);"></span></div>
            
            <button class="submit-btn" onclick="submitOrder()" id="btn-submit">
              Xác nhận đặt hàng <i data-lucide="check"></i>
            </button>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>

<script src="https://unpkg.com/lucide@latest"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
<script src="/shared/db.js"></script>
<script src="/shared/firebase.js"></script>
<script src="/shared/auth.js"></script>
<script src="/shared/app.js"></script>
<script>
DB.init();

let currentPayment = 'cod';

function initCheckout() {
  const cart = DB.getCart();
  if (!cart || cart.length === 0) {
    window.location.href = '/cart/';
    return;
  }
  
  const user = Auth.getCurrentUser();
  if (!user) {
    alert('Vui lòng đăng nhập để thanh toán!');
    window.location.href = '/login/?next=' + encodeURIComponent(window.location.pathname);
    return;
  }
  
  // Pre-fill user data
  if (user) {
    document.getElementById('f-name').value = user.name || '';
    if(user.email) document.getElementById('f-phone').value = user.phone || ''; // Might not have phone
  }

  let subtotal = 0;
  let itemsHtml = '';
  
  cart.forEach(item => {
    const itemTotal = item.price * item.qty;
    subtotal += itemTotal;
    
    let itemExtras = '';
      if (item.hasAcrylicBox) {
         itemExtras += `<div style="font-size:12px; color:var(--accent-green); margin-left:24px;">+ Hộp Mica</div>`;
      }
      if (item.engraving) {
         itemExtras += `<div style="font-size:12px; color:var(--text-muted); margin-left:24px;">+ Khắc: "${DB.escapeHTML(item.engraving)}"</div>`;
      }
      
      itemsHtml += `
        <div class="summary-item" style="display:flex; flex-direction:column; gap:4px;">
          <div style="display:flex; justify-content:space-between; width:100%;">
            <span class="summary-item-name">${item.qty}x ${DB.escapeHTML(item.name)}</span>
            <span>${DB.formatVND(itemTotal)}</span>
          </div>
          ${itemExtras}
        </div>
      `;
  });
  
  document.getElementById('summary-items').innerHTML = itemsHtml;
  document.getElementById('summary-subtotal').textContent = DB.formatVND(subtotal);
  document.getElementById('summary-total').textContent = DB.formatVND(subtotal);
}

window.selectPayment = function(el, method) {
  document.querySelectorAll('.payment-method').forEach(m => m.classList.remove('active'));
  el.classList.add('active');
  currentPayment = method;
};

window.submitOrder = async function() {
  const cart = DB.getCart();
  if (!cart || cart.length === 0) return;
  
  const name = document.getElementById('f-name').value;
  const phone = document.getElementById('f-phone').value;
  const address = document.getElementById('f-address').value;
  
  if (!name || !phone || !address) {
    alert("Vui lòng điền đầy đủ thông tin giao hàng!");
    return;
  }
  
  const btn = document.getElementById('btn-submit');
  btn.textContent = 'Đang xử lý...';
  btn.disabled = true;
  
  let subtotal = 0;
  cart.forEach(item => subtotal += item.price * item.qty);
  
  // Submit each item as a bid (temporary integration with existing DB structure)
  // In a real app, this would be one Order object containing multiple items.
  try {
    for (const item of cart) {
      if (item.isCustom) {
        await DB.addBid({
          id: DB.genId('bid'), dropId: item.id,
          dropName: `${item.name} (${item.mat}, ${item.size}, ${item.color})`,
          dropImage: item.image, budget: item.price * item.qty,
          status: 'pending', createdAt: new Date().toISOString(),
          customerName: name, phone: phone, address: address
        });
      } else {
        // Just order tracking
        await DB.addBid({
          id: DB.genId('order'), dropId: item.id,
          dropName: `${item.name} (Hàng Có Sẵn) - Qty: ${item.qty}`,
          dropImage: item.image, budget: item.price * item.qty,
          status: 'pending', createdAt: new Date().toISOString(),
          customerName: name, phone: phone, address: address
        });
        
        // Optionally decrement stock here via BDB if it existed, but we rely on current API.
      }
    }
    
    DB.clearCart();
    alert('Đặt hàng thành công! Cảm ơn bạn đã mua sắm.');
    window.location.href = '/drops/';
  } catch(e) {
    console.error(e);
    alert('Có lỗi xảy ra khi đặt hàng.');
    btn.textContent = 'Xác nhận đặt hàng';
    btn.disabled = false;
  }
};

document.addEventListener('DOMContentLoaded', () => {
  initCheckout();
});
</script>
</body>
</html>
